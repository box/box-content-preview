<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Box Audio Waveform POC</title>
        <link rel="stylesheet" href="./styles.css" />
    </head>
    <body>
        <header class="poc-header">
            <h1>Audio waveform POC</h1>
            <p>
                Static peaks via Web Audio <code>decodeAudioData</code> — no WaveSurfer.
                Default track is synthesized locally; optionally load a real MP3.
            </p>
            <p class="poc-hint">
                Zoom: scroll on the waveform, use <kbd>+</kbd> / <kbd>−</kbd>, or the zoom buttons.
                Pan with a horizontal scroll or <kbd>Shift</kbd> + arrows.
            </p>
        </header>

        <div class="bp-MP3Controls" data-testid="media-controls-wrapper" aria-label="Audio player">
            <div class="bp-DurationLabels">
                <span id="currentTime">0:00</span>
                <span class="bp-WindowRange" id="windowRange"></span>
                <span id="durationTime">0:00</span>
            </div>

            <div class="bp-Waveform is-loading" id="waveformWrap">
                <canvas
                    class="bp-Waveform-canvas"
                    id="waveform"
                    role="slider"
                    aria-label="Seek"
                    aria-valuemin="0"
                    aria-valuemax="0"
                    aria-valuenow="0"
                    tabindex="0"
                ></canvas>
            </div>

            <div class="bp-MP3Controls-bar">
                <div class="bp-MP3Controls-group">
                    <button type="button" class="bp-btn" id="playPause" aria-label="Play" title="Play">
                        <svg id="iconPlay" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M8 5v14l11-7z" />
                        </svg>
                        <svg id="iconPause" viewBox="0 0 24 24" aria-hidden="true" hidden>
                            <path d="M6 5h4v14H6zm8 0h4v14h-4z" />
                        </svg>
                    </button>

                    <div class="bp-Volume">
                        <button type="button" class="bp-btn" id="mute" aria-label="Mute" title="Mute">
                            <svg id="iconVolume" viewBox="0 0 24 24" aria-hidden="true">
                                <path
                                    d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1-3.29-2.5-4.03v8.05c1.5-.74 2.5-2.26 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"
                                />
                            </svg>
                            <svg id="iconMuted" viewBox="0 0 24 24" aria-hidden="true" hidden>
                                <path
                                    d="M16.5 12c0-1.77-1-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"
                                />
                            </svg>
                        </button>
                        <input
                            class="bp-Volume-slider"
                            id="volume"
                            type="range"
                            min="0"
                            max="1"
                            step="0.01"
                            value="0.85"
                            aria-label="Volume"
                        />
                    </div>
                </div>

                <div class="bp-MP3Controls-group">
                    <div class="bp-Zoom">
                        <button type="button" class="bp-btn" id="zoomOut" aria-label="Zoom out" title="Zoom out">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path
                                    d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14zM7 9h5v1H7z"
                                />
                            </svg>
                        </button>
                        <button
                            type="button"
                            class="bp-Zoom-level"
                            id="zoomLevel"
                            aria-label="Zoom level, click to reset"
                            title="Reset zoom"
                        >
                            1x
                        </button>
                        <button type="button" class="bp-btn" id="zoomIn" aria-label="Zoom in" title="Zoom in">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path
                                    d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14zM10 7H9v2H7v1h2v2h1v-2h2V9h-2z"
                                />
                            </svg>
                        </button>
                    </div>

                    <button
                        type="button"
                        class="bp-btn bp-SettingsStub"
                        aria-label="Settings (stub)"
                        title="Settings (stub)"
                        disabled
                    >
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path
                                d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.49.49 0 00-.59-.22l-2.39.96a7.07 7.07 0 00-1.63-.94l-.36-2.54A.48.48 0 0014 2h-4a.48.48 0 00-.48.41l-.36 2.54c-.59.24-1.13.55-1.63.94l-2.39-.96a.49.49 0 00-.59.22L2.75 8.87a.48.48 0 00.12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94L2.87 14.5a.49.49 0 00-.12.61l1.92 3.32c.12.22.39.3.59.22l2.39-.96c.5.39 1.04.71 1.63.94l.36 2.54c.05.24.25.41.49.41h4c.24 0 .44-.17.49-.41l.36-2.54c.59-.24 1.13-.55 1.63-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.49.49 0 00-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1115.6 12 3.6 3.6 0 0112 15.6z"
                            />
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <div class="poc-picker">
            <label>
                Try a real audio file
                <input id="fileInput" type="file" accept="audio/*,.mp3,.wav,.m4a,.ogg,.flac" />
            </label>
            <button type="button" class="bp-btn" id="resetMock" style="width: auto; padding: 0 10px; background: rgba(255,255,255,0.08)">
                Reset to mock audio
            </button>
            <div class="poc-status" id="status" data-tone="">Loading mock audio…</div>
        </div>

        <audio id="audio" preload="auto"></audio>

        <script type="module" src="./app.js"></script>
    </body>
</html>
