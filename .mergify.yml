merge_queue:
    max_parallel_checks: 1

queue_rules:
    - name: translations
      batch_size: 1
      queue_conditions:
          - base=master
          - author=boxmoji
          - title~=(?i)^chore\(i18n\):\supdate translations$
          - -files~=^(?!src/i18n/)
          - '#approved-reviews-by>=1'
          - '#changes-requested-reviews-by=0'
          - status-success=Travis CI - Pull Request
          - label!=do-not-merge
      merge_method: squash

    - name: default
      batch_size: 1
      queue_conditions:
          - base=master
          - '#approved-reviews-by>=1'
          - '#changes-requested-reviews-by=0'
          - '#review-requested=0'
          - status-success=Travis CI - Pull Request
          - label=ready-to-merge
          - label!=do-not-merge
          - title~=^(build|ci|chore|docs|feat|fix|perf|refactor|revert|style|test)(\([^)]+\))?:\s.+$
      merge_method: squash

pull_request_rules:
    - name: Automatic strict merge
      conditions: []
      actions:
          queue:
