<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>PREVIEW-1864 POC</title>
        <link rel="stylesheet" href="poc.css" />
        <style>
            body {
                align-items: center;
                background: #f4f4f4;
                display: flex;
                flex-direction: column;
                gap: 8px;
                justify-content: center;
                margin: 0;
                min-height: 220px;
            }

            /* Mirrors .bp-ControlsLayer so the harness reproduces how the bars are laid out in
               the real viewer. */
            #poc {
                display: flex;
            }

            /* Stands in for the annotation the viewer would report. Pinned out of the flex row so
               it cannot affect how the bars lay out or how wide they think they can be. */
            .poc-simulate {
                display: flex;
                gap: 4px;
                left: 8px;
                position: fixed;
                top: 8px;
            }
        </style>
    </head>
    <body>
        <div id="poc"></div>
        <script src="poc.js"></script>
    </body>
</html>
